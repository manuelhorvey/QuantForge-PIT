[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "quantforge-pit"
version = "0.1.0"
description = "Point-in-time, leakage-aware quantitative research and event-driven backtest scaffold"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4", "pydantic>=2.5"]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
